<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/pages/products.css" />
  <title>探索體驗 - 島嶼旅跡</title>
</head>

<body>
  <!-- header 掛載點 -->
  <header id="main-header"></header>
  <main class="container">
    <!-- 左側：篩選側欄 -->
    <aside class="filter-sidebar">
      <div class="sidebar-content">
        <div class="sidebar-header">
          <h3>篩選條件</h3>
          <button type="button" class="btn-reset">清除全部</button>
        </div>

        <div class="filter-group">
          <h4>地區</h4>
          <div class="tag-group" id="location-tags"></div>
        </div>

        <div class="filter-group">
          <h4>主題分類</h4>
          <div class="tag-group" id="category-tags"></div>
        </div>

        <div class="filter-group">
          <h4>時長</h4>
          <div class="tag-group" id="duration-tags"></div>
        </div>
      </div>
    </aside>

    <!-- 右側：主要商品列表區塊 -->
    <section class="product-content">
      <!-- 麵包屑導覽 -->
      <nav class="breadcrumb" aria-label="breadcrumb">
        <a href="main.html">首頁</a>
        <span class="separator">›</span>
        <span class="current">探索體驗</span>
      </nav>

      <!-- 數量標題與下拉選單（左右對齊） -->
      <div class="product-top-bar">
        <p class="product-count">共找到 <span id="product-count">12</span> 個體驗</p>
        <select class="sort-select">
          <!-- 選項由 JS 動態生成 -->
        </select>
      </div>

      <!-- 商品卡片 Grid 網格 -->
      <div class="product-grid" id="product-grid"></div>
    </section>
  </main>
  <!-- Footer 掛載點 -->
  <footer id="footer-container"></footer>

  <!-- 引入 Nav 設定檔腳本 -->
  <script src="./js/nav-config.js"></script>

  <!--共通商品資料檔 -->
  <script src="./js/products-data.js"></script>

  <script>
    //篩選與排序條件選項設定
    const locationList = ['台北', '新北', '台中', '台南', '高雄', '宜蘭', '花蓮', '嘉義', '屏東', '彰化'];
    const categories = [
      { name: '戶外冒險', icon: '🏕️' },
      { name: '手作工藝', icon: '🎨' },
      { name: '美食料理', icon: '🍳' },
      { name: '文化歷史', icon: '🏛️' }
    ];
    const durations = ['2小時', '3小時', '4小時', '半天', '全天'];
    const sortOptions = [
      { value: 'default', label: '預設排序' },
      { value: 'price-low', label: '價格由低到高' },
      { value: 'price-high', label: '價格由高到低' },
      { value: 'rating-high', label: '評分最高' },
      { value: 'reviews-most', label: '最多評論' }
    ];

    // 渲染商品卡片（使用可點擊連結，並防範愛心按鈕事件冒泡）
    function renderProducts(list) {
      const productGridEl = document.getElementById('product-grid');
      document.getElementById('product-count').textContent = list.length;

      if (list.length === 0) {
        productGridEl.innerHTML = `<p style="grid-column: 1/-1; text-align: center; padding: 40px 0; color: #888;">查無符合條件的體驗</p>`;
        return;
      }

      productGridEl.innerHTML = list.map(item =>
        `
       <a href="products-details.html?id=${item.id}" class="product-card">
         <div class="card-img-wrapper">
           <img src="https://picsum.photos/id/${item.imageId}/400" alt="${item.name}">
           <!-- 注意：愛心按鈕必須加上 e.preventDefault() 與 e.stopPropagation() 防止觸發連結 -->
           <button type="button" class="btn-favorite" title="收藏" onclick="event.preventDefault(); event.stopPropagation();">♥</button>
         </div>
         <div class="card-body">
           <span class="category-badge">${item.category}</span>
           <h4 class="card-title">${item.name}</h4>
           <div class="card-info">
             <span>📍 ${item.location}</span>
             <span>⏱️ ${item.duration}</span>
           </div>
           <div class="card-footer">
             <div class="price-box">
               <span class="currency">NT$</span>
               <span class="amount">${item.price.toLocaleString()}</span>
               <span class="unit">/ 人起</span>
             </div>
             <div class="rating-box">
             ${getStarIcons(item.rating)}      
              <span class="count">(${item.reviews})</span>
             </div>
           </div>
         </div>
       </a>
        `
      ).join('');
    }

    // 初始化側邊欄標籤 
    function initFilterUI() {
      document.getElementById('location-tags').innerHTML = locationList.map(loc =>
        `<button type="button" class="tag" data-type="location" data-value="${loc}">${loc}</button>`
      ).join('');

      document.getElementById('category-tags').innerHTML = categories.map(cat =>
        `<button type="button" class="tag" data-type="category" data-value="${cat.name}">${cat.icon} ${cat.name}</button>`
      ).join('');

      document.getElementById('duration-tags').innerHTML = durations.map(d =>
        `<button type="button" class="tag" data-type="duration" data-value="${d}">${d}</button>`
      ).join('');

      const sortSelectEl = document.querySelector('.sort-select');
      sortSelectEl.innerHTML = sortOptions.map(opt =>
        `<option value="${opt.value}">${opt.label}</option>`
      ).join('');
    }

    // 排序處理
    function sortProducts(list, sortType) {
      const sortedList = [...list];
      switch (sortType) {
        case 'price-low': return sortedList.sort((a, b) => a.price - b.price);
        case 'price-high': return sortedList.sort((a, b) => b.price - a.price);
        case 'rating-high': return sortedList.sort((a, b) => b.rating - a.rating);
        case 'reviews-most': return sortedList.sort((a, b) => b.reviews - a.reviews);
        case 'default':
        default: return sortedList.sort((a, b) => a.id - b.id);
      }
    }

    // 篩選與排序執行函式
    function executeFilter() {
      const activeTags = Array.from(document.querySelectorAll('.tag.active'));
      const currentSort = document.querySelector('.sort-select').value;

      let filtered = products;

      if (activeTags.length > 0) {
        const selectedLocations = activeTags.filter(t => t.dataset.type === 'location').map(t => t.dataset.value);
        const selectedCategories = activeTags.filter(t => t.dataset.type === 'category').map(t => t.dataset.value);
        const selectedDurations = activeTags.filter(t => t.dataset.type === 'duration').map(t => t.dataset.value);

        filtered = products.filter(item => {
          const matchLoc = selectedLocations.length === 0 || selectedLocations.includes(item.location);
          const matchCat = selectedCategories.length === 0 || selectedCategories.includes(item.category);
          const matchDur = selectedDurations.length === 0 || selectedDurations.includes(item.duration);
          return matchLoc && matchCat && matchDur;
        });
      }

      const finalProducts = sortProducts(filtered, currentSort);
      renderProducts(finalProducts);
    }

    // 事件監聽設定
    document.addEventListener('DOMContentLoaded', () => {
      initFilterUI();
      renderProducts(products);

      const filterSidebar = document.querySelector('.filter-sidebar');
      filterSidebar.addEventListener('click', (e) => {
        const tagBtn = e.target.closest('.tag');
        const resetBtn = e.target.closest('.btn-reset');

        if (tagBtn) {
          const tagGroup = tagBtn.closest('.tag-group');
          const isAlreadyActive = tagBtn.classList.contains('active');
          tagGroup.querySelectorAll('.tag').forEach(btn => btn.classList.remove('active'));
          if (!isAlreadyActive) tagBtn.classList.add('active');
          executeFilter();
        }

        if (resetBtn) {
          document.querySelectorAll('.tag.active').forEach(tag => tag.classList.remove('active'));
          executeFilter();
          return;
        }
      });

      const sortSelectEl = document.querySelector('.sort-select');
      sortSelectEl.addEventListener('change', executeFilter);

      // Nav 滾動變色效果
      const headerEl = document.getElementById('main-header');
      window.addEventListener('scroll', () => {
        if (window.scrollY > 40) {
          headerEl.classList.add('scrolled');
        } else {
          headerEl.classList.remove('scrolled');
        }
      });
    });
  </script>
</body>

</html>
