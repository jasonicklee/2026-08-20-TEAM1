<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/air-datepicker@3.6.0/air-datepicker.css" />
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/pages/booking.css" />

  <title>Document</title>
</head>

<body>
  <!-- Header 掛載點 -->
  <header id="main-header"></header>
  <main>
    <div class="stepper">
      <div class="step-item active">
        <div class="step-top">
          <div class="step-circle">1</div>
          <div class="step-line"></div>
        </div>
        <p class="step-text">選擇日期</p>
      </div>

      <div class="step-item">
        <div class="step-top">
          <div class="step-circle">2</div>
          <div class="step-line"></div>
        </div>
        <p class="step-text">填寫資料</p>
      </div>

      <div class="step-item">
        <div class="step-top">
          <div class="step-circle">3</div>
        </div>
        <p class="step-text">預訂完成</p>
      </div>
    </div>

    <div class="booking-layout">
      <!-- 左邊 -->
      <div class="booking-left">
        <div class="calendar-card">
          <div class="h6 text-blue font-family-serif">日期選擇</div>
          <div id="calendar"></div>
        </div>

        <div class="session-card">
          <h6 class="h6 text-blue font-family-serif">選擇場次</h6>

          <div class="session-list">
            <button type="button" class="btn-item">
              09:00<br />
              <span class="font-family-serif">🌅 上午場</span>
            </button>
            <button type="button" class="btn-item">
              14:00<br />
              <span class="font-family-serif">🌅 下午場</span>
            </button>
          </div>
          <button type="button" class="btn btn-orange text-white w-100">
            下一步：填寫旅客資料 →
          </button>
        </div>
      </div>

      <!-- 右邊 -->
      <div class="session-card summary-card">
        <p class="h6 text-blue font-family-serif mb-10">預訂摘要</p>
        <img src="https://picsum.photos/600/200" alt="" />
        <p class="h6 text-blue font-family-serif">清水斷崖獨木舟探險</p>
        <table class="summary-table">
          <tbody>
            <tr>
              <th>目的地</th>
              <td>花蓮</td>
            </tr>

            <tr>
              <th>時間長度</th>
              <td>半天</td>
            </tr>

            <tr>
              <th>選擇日期</th>
              <td class="text-orange">尚未選擇</td>
            </tr>

            <tr>
              <th>選擇場次</th>
              <td class="text-orange">尚未選擇</td>
            </tr>

            <tr class="price-row">
              <th>價格</th>
              <td class="price">NT$ 1,800 / 人</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
  <!-- Footer 掛載點 -->
  <footer id="footer-container"></footer>

  <!-- 引入 Nav 設定檔腳本 -->
  <script src="./js/nav-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/air-datepicker@3.6.0/air-datepicker.js"></script>
  <script>
    const localeZhTw = {
      days: [
        "星期日",
        "星期一",
        "星期二",
        "星期三",
        "星期四",
        "星期五",
        "星期六",
      ],
      daysShort: ["日", "一", "二", "三", "四", "五", "六"],
      daysMin: ["日", "一", "二", "三", "四", "五", "六"],
      months: [
        "一月",
        "二月",
        "三月",
        "四月",
        "五月",
        "六月",
        "七月",
        "八月",
        "九月",
        "十月",
        "十一月",
        "十二月",
      ],
      monthsShort: [
        "一月",
        "二月",
        "三月",
        "四月",
        "五月",
        "六月",
        "七月",
        "八月",
        "九月",
        "十月",
        "十一月",
        "十二月",
      ],
      today: "今天",
      clear: "清除",
      dateFormat: "yyyy/MM/dd",
      firstDay: 0,
    };
    new AirDatepicker("#calendar", {
      inline: true,
      startDate: new Date(2026, 7, 23),
      locale: localeZhTw,
    });
  </script>
</body>

</html>
