<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>島嶼旅跡｜登入</title>
  <link rel="stylesheet" href="./css/login.css">
</head>
<body>
  <main class="login-page">
    <section class="login-visual">
      <a href="index.html" class="login-visual__logo">島嶼旅跡<span>・</span></a>
      <div class="login-visual__content">
        <h1 class="login-visual__title">每一趟旅程，<br>都是<span>全新的自己</span></h1>
        <p class="login-visual__desc">加入島嶼旅跡，開啟你的台灣深度之旅</p>
      </div>
    </section>

    <section class="login-panel">
      <div class="login-form">
        <div class="login-tabs">
          <button type="button" class="login-tabs__btn is-active">登入</button>
          <button type="button" class="login-tabs__btn">註冊</button>
        </div>

        <div class="login-form__heading">
          <h2 class="login-form__title">歡迎回來 👋</h2>
          <p class="login-form__subtitle">登入帳號以管理你的旅行體驗</p>
        </div>

        <div class="login-field">
          <label for="email" class="login-field__label">電子信箱</label>
          <input id="email" class="login-field__input" type="email" placeholder="your@email.com">
        </div>

        <div class="login-field">
          <label for="password" class="login-field__label">密碼</label>
          <div class="login-field__password">
            <input id="password" class="login-field__input" type="password" placeholder="輸入密碼">
            <span class="login-field__eye">◉</span>
          </div>
        </div>

        <div class="login-form__forgot"><a href="#">忘記密碼？</a></div>
        <button type="button" class="login-form__submit">登入</button>

        <div class="login-divider"><span>或使用</span></div>

        <button type="button" class="login-social">🌐 使用 Google 帳號登入</button>
        <button type="button" class="login-social">📘 使用 Facebook 帳號登入</button>

        <p class="login-form__register">還沒有帳號？ <a href="#">點此免費註冊</a></p>
      </div>
    </section>
  </main>
</body>
</html>
