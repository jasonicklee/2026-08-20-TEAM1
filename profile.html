<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/pages/profile.css" />
  <title>Document</title>
</head>

<body>
  <!-- header 掛載點 -->
  <header id="main-header"></header>

  <main>
    <div class="pt-16 pb-48">
      <div class="container">
        <div class="profile-layout">
          <div class="d-flex flex-column">
            <div class="profile mb-20">
              <img src="https://picsum.photos/50" alt="" />
              <p class="text-blue">旅遊達人</p>
              <p class="text-grey">demo@islandtrace.tw</p>
              <p class="badge badge-green">
                ⭐ <span class="h6 text-green">探險會員</span>
              </p>
            </div>

            <!-- 左邊 -->
            <div class="sidebar">
              <div class="tab-menu">
                <button type="button" class="tab-btn active" data-tab="order">
                  訂單紀錄
                </button>
                <button type="button" class="tab-btn" data-tab="favorite">
                  我的收藏
                </button>
                <button type="button" class="tab-btn" data-tab="profile">
                  個人資料
                </button>
                <button type="button" class="tab-btn text-red">登出</button>
              </div>
            </div>
          </div>
          <!-- 右邊 -->
          <div class="profile-content">
            <div class="tab-pane active" id="order">
              <h2 class="h3">訂單紀錄</h2>
              <table class="order-table">
                <thead>
                  <tr>
                    <th class="text-left">體驗</th>
                    <th>日期 / 場次</th>
                    <th>金額</th>
                    <th>狀態</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>
                      <div class="experience">
                        <img src="https://picsum.photos/50" alt="" class="mr-12" />
                        <div class="experience-info">
                          <p class="experience-title">清水斷崖獨木舟探險</p>
                          <p class="experience-location">📍 花蓮</p>
                        </div>
                      </div>
                    </td>
                    <td>
                      <p>2025/7/15</p>
                      <p class="text-grey">上午場 09:00</p>
                    </td>
                    <td class="text-red">NT$ 1,800</td>
                    <td>
                      <span class="badge badge-orange text-orange font-family-serif">未出發</span>
                    </td>
                    <td>
                      <button type="button" class="btn btn-order">
                        取消訂單
                      </button>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <div class="experience">
                        <img src="https://picsum.photos/50" alt="" class="mr-12" />
                        <div class="experience-info">
                          <p class="experience-title">
                            淡水老街藍染拼布工作坊
                          </p>
                          <p class="experience-location">📍 新北</p>
                        </div>
                      </div>
                    </td>
                    <td>
                      <p>2025/5/20</p>
                      <p class="text-grey">下午場 14:00</p>
                    </td>
                    <td class="text-red">NT$ 1,200</td>
                    <td>
                      <span class="badge badge-orange text-green font-family-serif">已完成</span>
                    </td>
                    <td></td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="tab-pane" id="favorite">
              <div>
                <h2 class="h3">我的收藏</h2>
                <div class="collect-content">
                  <p class="mb-10 font-family-serif">收藏清單是空的</p>
                  <p class="mb-10 font-family-serif">
                    在體驗列表頁點選愛心圖示，即可加入收藏
                  </p>
                  <button type="button" class="btn btn-orange text-white">
                    去探索體驗
                  </button>
                </div>
              </div>
            </div>
            <form>
              <div class="tab-pane" id="profile">
                <h2 class="h3">個人資料</h2>
                <div class="profile-form">
                  <div class="form-item">
                    <label for="name" class="h6 font-family-serif text-blue">姓名</label>
                    <input type="text" id="name" value="旅遊達人" placeholder="請輸入姓名" />
                  </div>
                  <div class="form-item">
                    <label for="phoneNum" class="h6 font-family-serif text-blue">手機號碼</label>
                    <input type="text" id="phoneNum" placeholder="09xx-xxx-xxx" />
                  </div>
                  <div class="form-item">
                    <label for="email" class="h6 font-family-serif text-blue">電子信箱</label>
                    <input type="email" id="email" value="demo@islandtrace.tw" placeholder="請輸入電子信箱" />
                  </div>
                  <div class="form-item">
                    <label for="birthday" class="h6 font-family-serif text-blue">出生日期</label>
                    <input type="date" id="birthday" />
                  </div>
                  <div>
                    <p class="h6 font-family-serif text-blue">旅遊偏好</p>
                    <div>
                      🧳 戶外冒險　🎨 手作工藝　🍷 美食料理　🏛 文化歷史
                    </div>
                  </div>
                  <div class="save-button">
                    <button type="button" class="btn btn-orange text-white">
                      儲存更改
                    </button>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
  <!-- Footer 掛載點 -->
  <footer id="footer-container"></footer>

  <!-- 引入 Nav 設定檔腳本 -->
  <script src="./js/nav-config.js"></script>
  <script>
    const tabBtns = document.querySelectorAll(".tab-btn");
    const tabPanes = document.querySelectorAll(".tab-pane");

    tabBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        tabBtns.forEach((item) => {
          item.classList.remove("active");
        });

        tabPanes.forEach((item) => {
          item.classList.remove("active");
        });

        btn.classList.add("active");

        const tabName = btn.dataset.tab;
        const target = document.querySelector(`#${tabName}`);

        target.classList.add("active");
      });
    });
  </script>
</body>

</html>
